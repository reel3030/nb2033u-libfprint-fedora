name: Build Arch Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system & Install build dependencies
        run: |
          pacman -Syu --noconfirm
          # gtk-doc を含むビルド依存パッケージを一括インストール
          pacman -S --noconfirm base-devel git meson ninja glib2 libgudev libgusb pixman nss polkit systemd gobject-introspection gtk-doc

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch Package via makepkg
        run: |
          useradd -m builduser
          chown -R builduser:builduser .
          # -s (--syncdeps) は使わず、事前導入済みとしてビルドのみ実行
          su builduser -c "makepkg -f --noconfirm"

name: Build Arch Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system & Install makepkg deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja glib2 libgudev libgusb pixman nss polkit systemd gobject-introspection

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch Package via makepkg
        run: |
          # makepkg requires a non-root user
          useradd -m builduser
          chown -R builduser:builduser .
          su builduser -c "makepkg --nodeps --noextract"

name: Build Arch Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]name: Build Arch Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system & Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja glib2 libgudev libgusb pixman nss polkit systemd gobject-introspection

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List files in workspace
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== Directory Contents ==="
          ls -la

      - name: Build Arch Package via makepkg
        run: |
          useradd -m builduser
          chown -R builduser:builduser .
          su builduser -c "makepkg -sf --noconfirm"
  workflow_dispatch:


name: Build Arch Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system & Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git meson ninja glib2 libgudev libgusb pixman nss polkit systemd gobject-introspection

      # 1. 確実にチェックアウトを行う
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 権限設定と makepkg の実行
      - name: Build Arch Package via makepkg
        run: |
          # makepkg用の非rootユーザー作成
          useradd -m builduser
          
          # 作業ディレクトリ全体の所有権を builduser に変更
          chown -R builduser:builduser .
          
          # builduser として PKGBUILD を実行（-s: 依存解決, -f: 強制再ビルド, --noconfirm: 自動承認）
          su builduser -c "makepkg -sf --noconfirm"
